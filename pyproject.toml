[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clearsight"
version = "1.0.0"
description = "Zero-cloud local survey tabulation, rim weighting, and Taglish NLP platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ClearSight Core Architecture Team" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
spss = ["pyreadstat>=1.2.0"]
test = ["pytest>=8.0.0", "hypothesis>=6.100"]
# optional local-model fallback for coder v2 (offline; never installed by default)
model = ["model2vec>=0.4"]
# P7-35: coder v3's embedding path. Without these, v3 silently runs its hash-embedding fallback.
# Weights are NOT downloaded at run time (HF_HUB_OFFLINE=1); ship them and point CLEARSIGHT_V3_MODEL_DIR at the folder.
coder-v3 = ["sentence-transformers>=3.0,<6", "torch>=2.2", "scikit-learn>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
